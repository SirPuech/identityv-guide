<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400">
  <defs>
    <linearGradient id="bgGrad_first-officer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <radialGradient id="glow_first-officer" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)" />
    </radialGradient>
    <filter id="shadow_first-officer">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.7)" />
    </filter>
  </defs>

  <!-- Deep Onyx Canvas -->
  <rect width="320" height="400" fill="#0F172A" rx="16" />
  <rect width="320" height="400" fill="url(#bgGrad_first-officer)" opacity="0.28" rx="16" />
  <rect width="320" height="400" fill="url(#glow_first-officer)" rx="16" />

  <!-- Outer Kinetic Border -->
  <rect x="2" y="2" width="316" height="396" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.4" rx="14" />
  
  <!-- Identity V Corner Stitches / Accent Lines -->
  <line x1="16" y1="26" x2="36" y2="26" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
  <line x1="26" y1="16" x2="26" y2="36" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
  
  <line x1="284" y1="26" x2="304" y2="26" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
  <line x1="294" y1="16" x2="294" y2="36" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />

  <!-- Role Emblem Badge -->
  <rect x="18" y="44" width="80" height="24" rx="12" fill="rgba(15,23,42,0.85)" stroke="#60A5FA" stroke-width="1" />
  <text x="58" y="60" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">
    RESCUER
  </text>

  <!-- Type Badge -->
  <circle cx="286" cy="56" r="8" fill="#10B981" />

  <!-- Central Silhouette / Avatar Circle -->
  <g filter="url(#shadow_first-officer)">
    <circle cx="160" cy="180" r="84" fill="#111827" stroke="#60A5FA" stroke-width="3" />
    <circle cx="160" cy="180" r="76" fill="url(#bgGrad_first-officer)" opacity="0.85" />
    
    <!-- Identity V Button Eyes motif -->
    <circle cx="140" cy="165" r="14" fill="#0F172A" stroke="#F8FAFC" stroke-width="3" />
    <line x1="135" y1="160" x2="145" y2="170" stroke="#F8FAFC" stroke-width="2" />
    <line x1="145" y1="160" x2="135" y2="170" stroke="#F8FAFC" stroke-width="2" />

    <circle cx="180" cy="165" r="14" fill="#0F172A" stroke="#F8FAFC" stroke-width="3" />
    <line x1="175" y1="160" x2="185" y2="170" stroke="#F8FAFC" stroke-width="2" />
    <line x1="185" y1="160" x2="175" y2="170" stroke="#F8FAFC" stroke-width="2" />

    <!-- Stitched Smile -->
    <path d="M 132 205 Q 160 220 188 205" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    <line x1="142" y1="202" x2="142" y2="216" stroke="#0F172A" stroke-width="2" />
    <line x1="152" y1="205" x2="152" y2="219" stroke="#0F172A" stroke-width="2" />
    <line x1="168" y1="205" x2="168" y2="219" stroke="#0F172A" stroke-width="2" />
    <line x1="178" y1="202" x2="178" y2="216" stroke="#0F172A" stroke-width="2" />

    <!-- Feature Glyph Badge -->
    <circle cx="216" cy="236" r="22" fill="#0F172A" stroke="#60A5FA" stroke-width="2" />
    <text x="216" y="244" font-size="20" text-anchor="middle">⚓</text>
  </g>

  <!-- Hero Name Label -->
  <text x="160" y="318" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">
    First Officer
  </text>
  
  <text x="160" y="342" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="2">
    IDENTITY V • SURVIVOR
  </text>

  <!-- Bottom Accent bar -->
  <rect x="60" y="366" width="200" height="4" rx="2" fill="#60A5FA" opacity="0.6" />
</svg>